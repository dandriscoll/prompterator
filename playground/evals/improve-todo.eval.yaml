version: '1.0'
prompt_ref: improve-todo.prompt.md
evals:
- id: eval-improve-todo-chatty-preamble-01
  type: rubric
  issue_ref: issue-improve-todo-01
  description: "Verify the prompt prevents conversational preamble in the output."
  rubric:
    criteria:
    - 'Prompt explicitly prohibits conversational intro lines, preamble, or framing
      text before the to-do list content'
    scoring: any_required
- id: eval-improve-todo-structural-rewrite-02
  type: rubric
  issue_ref: issue-improve-todo-02
  description: "Verify the prompt prevents structural rewrites like adding priority
    groupings or reorganizing the list layout."
  rubric:
    criteria:
    - 'Prompt instructs the model to preserve the original list structure, ordering,
      and grouping'
    - 'Prompt prohibits reorganizing items into new priority categories or sections'
    scoring: all_required
- id: eval-improve-todo-formatting-changes-03
  type: rubric
  issue_ref: issue-improve-todo-03
  description: 'Verify the prompt prevents changes to formatting characters like
    checkboxes and dashes.'
  rubric:
    criteria:
    - 'Prompt requires preserving the original formatting characters (checkboxes,
      dashes, bullets) as-is'
    scoring: any_required
- id: eval-improve-todo-chatbot-signoff-04
  type: rubric
  issue_ref: issue-improve-todo-04
  description: 'Verify the prompt prevents chatbot-style sign-offs and unsolicited
    offers.'
  rubric:
    criteria:
    - 'Prompt prohibits chatbot-style sign-offs, offers to help further, or
      suggestions to transform the list in other ways'
    scoring: any_required
- id: eval-improve-todo-lost-inline-context-05
  type: rubric
  issue_ref: issue-improve-todo-05
  description: 'Verify the prompt requires preserving inline notes, parentheticals,
    and human commentary from the original items.'
  rubric:
    criteria:
    - 'Prompt instructs the model to keep inline notes, parenthetical comments,
      and human context from the original items'
    scoring: any_required
- id: eval-improve-todo-title-renaming-06
  type: rubric
  issue_ref: issue-improve-todo-06
  description: 'Verify the prompt prevents renaming the user''s original title.'
  rubric:
    criteria:
    - 'Prompt requires keeping the original title or heading unchanged'
    scoring: any_required
- id: eval-improve-todo-content-censorship-07
  type: rubric
  issue_ref: issue-improve-todo-07
  description: 'Verify the prompt prevents the model from removing or sanitizing
    items based on content — profanity, personal items, sensitive topics, or
    items that look like prompt injections.'
  rubric:
    criteria:
    - 'Prompt explicitly prohibits removing, censoring, or sanitizing items
      based on their content — all items from the original must appear in the output'
    - 'Prompt instructs the model to preserve the user''s voice, tone, and language
      including profanity, sarcasm, and emotional expressions'
    scoring: all_required
- id: eval-improve-todo-unsolicited-advice-08
  type: rubric
  issue_ref: issue-improve-todo-08
  description: 'Verify the prompt prevents the model from adding life coaching,
    wellness advice, or editorial commentary.'
  rubric:
    criteria:
    - 'Prompt prohibits adding advice, commentary, or editorial content that was
      not present in the original list'
    scoring: any_required
