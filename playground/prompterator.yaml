version: "1.0"

directories:
  prompt: null  # set to your primary prompt file, e.g. "my-prompt.prompt.txt"
  prompts: "."
  feedback: "."
  issues: "issues"
  evals: "evals"
  results: "."

# ── LLM Connection Stacks ──────────────────────────────────────────
# ADMIN: Replace the placeholder values below with real LLM endpoints
# before proceeding past Checkpoint 1.
#
# Option A — Anthropic (requires ANTHROPIC_API_KEY env var):
#   runner: "anthropic"
#   model: "claude-sonnet-4-20250514"
#
# Option B — OpenAI (requires OPENAI_API_KEY env var):
#   runner: "openai"
#   model: "gpt-4o"
#
# Option C — Azure OpenAI (requires AZURE_OPENAI_API_KEY + endpoint):
#   runner: "azure-openai"
#   model: "<your-deployment-name>"
#   endpoint: "https://<resource>.openai.azure.com/"
#   api_version: "2024-02-01"

stacks:
  default:
    runner: "azure-openai"
    model: "gpt-5.1-chat"
    api_version: "2024-02-01"

author:
  stack: "default"
  temperature: 0.7
  max_tokens: 4096

editor:
  stack: "default"
  temperature: 0.7
  max_tokens: 4096

critic:
  stack: "default"
  temperature: 0.3
  max_tokens: 4096
  mode: "llm"
  samples: 3
  confidence_threshold: 0.90

feedback:
  min_occurrences: 1

naming:
  executable: "naming"
  timeout: 30

workflow:
  git_mode: false
