[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompterator"
version = "0.2.0"
description = "CLI tool for prompt improvement workflow"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Prompterator Authors" }
]
keywords = ["prompts", "llm", "cli", "feedback"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "markback>=0.1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
all = ["anthropic>=0.30", "openai>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
prompterator = "prompterator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prompterator"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/bin",
]

[tool.hatch.build.targets.wheel.shared-data]
"bin/ft" = "share/prompterator/bin/ft"
"bin/llm-anthropic" = "share/prompterator/bin/llm-anthropic"
"bin/llm-openai" = "share/prompterator/bin/llm-openai"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
